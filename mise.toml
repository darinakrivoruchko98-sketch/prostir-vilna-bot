[tools]
node = "latest"

[tasks.start]
run = "node bootstrap.js"
description = "Start the Telegram bot"

[tasks.install]
run = "npm install"
description = "Install dependencies"

[tasks.zip]
run = """
version=$(cat VERSION | tr -d '[:space:]')
filename="vilna-bot-${version}.zip"
zip -r "$filename" bootstrap.js server.js package.json package-lock.json nixpacks.toml src/
echo "Created $filename"
"""
description = "Zip files for Dokploy deployment"
